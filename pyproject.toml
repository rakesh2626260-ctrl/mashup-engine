[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mashup-engine"
version = "0.1.0"
description = "Make a mashup from 2+ songs, then edit videos to match it"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.16.3",
  "librosa==0.10.2.post1",
  "soundfile==0.14.0",
  "pyrubberband==0.4.0",
  "scenedetect==0.6.5",
  "opencv-python-headless==5.0.0.93",
]

[project.optional-dependencies]
stems = ["torch==2.9.1", "demucs==4.0.1"]
all = ["torch==2.9.1", "demucs==4.0.1"]

[project.scripts]
mashup = "mashup.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mashup*"]
